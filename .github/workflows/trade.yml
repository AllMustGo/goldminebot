name: GOLDMINEBOT

on:
  schedule:
    # Every 5 min on weekdays, covering market hours in both EST and EDT.
    # The bot checks Alpaca's market clock itself, so extra runs just exit.
    - cron: "30-55/5 13 * * 1-5"
    - cron: "*/5 14-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: goldminebot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          PAPER: ${{ vars.PAPER }}
          STRATEGY: ${{ vars.STRATEGY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MAX_DOLLARS_PER_TRADE: ${{ vars.MAX_DOLLARS_PER_TRADE }}
          MAX_DAILY_LOSS: ${{ vars.MAX_DAILY_LOSS }}
          MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          REWARD_RISK: ${{ vars.REWARD_RISK }}
          MAX_STOP_PCT: ${{ vars.MAX_STOP_PCT }}
          MOMENTUM_MIN_GAIN_PCT: ${{ vars.MOMENTUM_MIN_GAIN_PCT }}
